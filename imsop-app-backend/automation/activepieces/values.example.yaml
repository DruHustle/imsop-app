# CANDIDATE only; verify against the pinned official Activepieces Helm chart before use.
# Deploy as a separate IMSOP release in its own namespace, never a shared Onesa app.
activepieces:
  edition: ce
frontendUrl: https://REPLACE_WITH_IMSOP_ONLY_AUTOMATION_ORIGIN
postgresql:
  enabled: false
  host: REPLACE_WITH_IMSOP_AUTOMATION_POSTGRES_HOST
  port: 5432
  useSSL: true
  auth:
    database: imsop_activepieces
    username: imsop_automation
    externalSecret:
      name: imsop-activepieces-postgres
      key: password
redis:
  enabled: false
  host: REPLACE_WITH_IMSOP_AUTOMATION_REDIS_HOST
  port: 6379
  useSSL: true
  auth:
    enabled: true
    externalSecret:
      name: imsop-activepieces-redis
      key: password
