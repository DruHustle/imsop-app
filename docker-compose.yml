services:
  mysql:
    image: mysql:8.0
    container_name: imsop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: imsop
      MYSQL_USER: imsop
      MYSQL_PASSWORD: imsop
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init:/docker-entrypoint-initdb.d:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: imsop-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ALLOWED_ORIGIN: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: imsop
      DB_PASSWORD: imsop
      DB_NAME: imsop
      JWT_SECRET: change-me-in-production
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_BASE_PATH: /
        VITE_API_URL: http://localhost:3001
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: imsop-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started

volumes:
  mysql_data:
