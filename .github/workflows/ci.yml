name: Application checks

on:
  push:
    branches: [dev, staging, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Feature branches qualify through their PR, rather than push + PR duplicates.
# Manual publication callers retain their own exact-source qualification run.
concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name != 'push' && github.event_name != 'pull_request') && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: smart-logistics-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-logistics-frontend/pnpm-lock.yaml
      - name: Shared local and hosted frontend source checks
        working-directory: .
        run: node local-tools/ci/local-checks.mjs frontend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failure-${{ github.run_id }}
          path: |
            smart-logistics-frontend/playwright-report/
            smart-logistics-frontend/test-results/
          retention-days: 7

  backend-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart-logistics-backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-logistics-backend/server/pnpm-lock.yaml
      - name: Shared local and hosted backend source checks
        working-directory: .
        run: node local-tools/ci/local-checks.mjs backend-node

  backend-dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-logistics-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared local and hosted .NET source checks
        working-directory: .
        run: node local-tools/ci/local-checks.mjs backend-dotnet

  release-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node local-tools/ci/local-checks.mjs release-boundaries

  qualify-system:
    uses: ./.github/workflows/system-qualification.yml
