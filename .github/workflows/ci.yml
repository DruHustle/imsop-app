name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: imsop-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: imsop-app-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  backend-node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: imsop-app-backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: imsop-app-backend/server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check image retention boundaries
        working-directory: imsop-app-backend
        run: python3 -m unittest discover -s scripts -p 'test_image_retention.py' -v
      - name: Check Onesa origin, sender and private database configuration
        working-directory: imsop-app-backend
        run: python3 scripts/test_onesa_migration_config.py --require-compose

  backend-dotnet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: imsop-app-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/IMSOP.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build src/IMSOP.sln --no-restore --configuration Release
      - run: dotnet test src/IMSOP.sln --no-build --configuration Release --verbosity normal
