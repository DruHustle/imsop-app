name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: smart-logistics-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-logistics-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          VITE_BASE_PATH: /
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failure-${{ github.run_id }}
          path: |
            smart-logistics-frontend/playwright-report/
            smart-logistics-frontend/test-results/
          retention-days: 7

  backend-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart-logistics-backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-logistics-backend/server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Verify standalone Python logistics edge
        working-directory: smart-logistics-backend/edge
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Validate Node-RED artifacts
        run: |
          node --check ../edge/node-red/settings.js
          python3 -m json.tool ../edge/node-red/flows.example.json > /dev/null
      - run: pnpm audit --prod --audit-level=low
      - name: Check image retention boundaries
        working-directory: smart-logistics-backend
        run: python3 -m unittest discover -s scripts -p 'test_image_retention.py' -v
      - name: Check Onesa origin, sender and private database configuration
        working-directory: smart-logistics-backend
        run: python3 scripts/test_onesa_migration_config.py --require-compose
      - name: Check independent Logistics tunnel and runtime boundaries
        working-directory: smart-logistics-backend
        run: python3 -m unittest discover -s scripts -p 'test_logistics_ingress.py' -v

  backend-dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-logistics-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/SmartLogistics.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build src/SmartLogistics.sln --no-restore --configuration Release
      - run: dotnet test src/SmartLogistics.sln --no-build --configuration Release --verbosity normal

  release-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test local-tools/ci/*.test.mjs
      - run: bash -n smart-logistics-frontend/deploy.sh

  qualify-system:
    uses: ./.github/workflows/system-qualification.yml
